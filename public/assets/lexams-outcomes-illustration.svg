</g>
<g transform="translate(812 532)" filter="url(#s)"><rect width="208" height="112" rx="24" fill="#fff" stroke="#DDE2E8"/><circle cx="48" cy="56" r="24" fill="#EEF3F8"/><path d="M38 59h20M42 50h12M42 68h16" stroke="#0E4C8F" stroke-width="3" stroke-linecap="round"/><text x="82" y="49" font-family="Arial" font-weight="700" font-size="14" fill="#002B54">Evidence</text><text x="82" y="70" font-family="Arial" font-size="11" fill="#748194">ready to share</text></g>
