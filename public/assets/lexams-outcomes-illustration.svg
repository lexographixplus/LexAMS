<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">LexAMS outcomes and certification illustration</title>
<desc id="desc">Abstract illustration showing surveys, assessments, reporting and branded certification.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5EC"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002B54" flood-opacity=".12"/></filter>
</defs>
<rect width="1100" height="720" rx="44" fill="url(#bg)"/>
<circle cx="925" cy="125" r="115" fill="#FAB72D" opacity=".12"/>
<circle cx="145" cy="605" r="160" fill="#0E4C8F" opacity=".06"/>
<g filter="url(#s)">
