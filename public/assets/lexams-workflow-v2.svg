<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">LexAMS activity workflow illustration</title><desc id="desc">Abstract product illustration showing an activity moving from planning to registration, attendance, measurement and certification.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f2e9"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#002B54"/><stop offset="1" stop-color="#0E4C8F"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#002B54" flood-opacity=".12"/></filter></defs><rect width="1200" height="760" rx="48" fill="#F7F5EF"/><circle cx="1030" cy="92" r="130" fill="#FAB72D" opacity=".10"/><circle cx="120" cy="670" r="170" fill="#0E4C8F" opacity=".06"/><g filter="url(#shadow)"><rect x="110" y="92" width="980" height="576" rx="34" fill="url(#paper)" stroke="#DDE2E8"/><rect x="110" y="92" width="980" height="64" rx="34" fill="url(#navy)"/><circle cx="152" cy="124" r="7" fill="#fff" opacity=".45"/><circle cx="176" cy="124" r="7" fill="#fff" opacity=".28"/><circle cx="200" cy="124" r="7" fill="#FAB72D"/><rect x="110" y="128" width="980" height="28" fill="url(#navy)"/><rect x="110" y="156" width="180" height="512" fill="#F0F3F6"/><text x="145" y="210" font-family="Georgia,serif" font-weight="700" font-size="28" fill="#002B54">LexAMS</text><g fill="#CCD5DF"><rect x="145" y="252" width="106" height="12" rx="6"/><rect x="145" y="294" width="84" height="12" rx="6"/><rect x="145" y="336" width="96" height="12" rx="6"/><rect x="145" y="378" width="72" height="12" rx="6"/><rect x="145" y="420" width="102" height="12" rx="6"/></g><rect x="145" y="244" width="7" height="28" rx="3.5" fill="#FAB72D"/><g transform="translate(340 208)"><text x="0" y="0" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#002B54">Activity lifecycle</text><text x="0" y="32" font-family="Arial,sans-serif" font-size="14" fill="#6B788A">One connected operational record from setup to evidence.</text><g transform="translate(0 78)"><g><rect width="650" height="74" rx="18" fill="#fff" stroke="#DDE2E8"/><circle cx="38" cy="37" r="19" fill="#EEF3F8"/><path d="M30 38h16M38 30v16" stroke="#0E4C8F" stroke-width="3" stroke-linecap="round"/><text x="76" y="33" font-family="Arial" font-weight="700" font-size="15" fill="#002B54">Plan the activity</text><text x="76" y="54" font-family="Arial" font-size="12" fill="#748194">Dates, venue, facilitator and registration settings</text><circle cx="612" cy="37" r="13" fill="#E7F4EC"/><path d="m606 37 4 4 8-9" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 92)"><rect width="650" height="74" rx="18" fill="#fff" stroke="#DDE2E8"/><circle cx="38" cy="37" r="19" fill="#FFF3D8"/><path d="M31 42c3-7 11-7 14 0M38 33a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" fill="none" stroke="#C58A13" stroke-width="2.6"/><text x="76" y="33" font-family="Arial" font-weight="700" font-size="15" fill="#002B54">Register participants</text><text x="76" y="54" font-family="Arial" font-size="12" fill="#748194">Reusable participant records and shareable links</text><circle cx="612" cy="37" r="13" fill="#E7F4EC"/><path d="m606 37 4 4 8-9" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 184)"><rect width="650" height="74" rx="18" fill="#fff" stroke="#DDE2E8"/><circle cx="38" cy="37" r="19" fill="#EEF3F8"/><path d="M29 30h18v18H29zM33 34h4v4h-4zm8 0h2v2h-2zm0 8h3v3h-3z" fill="none" stroke="#0E4C8F" stroke-width="2.2"/><text x="76" y="33" font-family="Arial" font-weight="700" font-size="15" fill="#002B54">Track attendance</text><text x="76" y="54" font-family="Arial" font-size="12" fill="#748194">Check-in and session records tied to the activity</text><circle cx="612" cy="37" r="13" fill="#E7F4EC"/><path d="m606 37 4 4 8-9" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 276)"><rect width="650" height="74" rx="18" fill="#fff" stroke="#DDE2E8"/><circle cx="38" cy="37" r="19" fill="#FFF3D8"/><path d="M30 44h5V34h-5zm9 0h5V27h-5zm9 0h5V21h-5z" fill="#C58A13"/><text x="76" y="33" font-family="Arial" font-weight="700" font-size="15" fill="#002B54">Measure outcomes</text><text x="76" y="54" font-family="Arial" font-size="12" fill="#748194">Surveys and assessments stay connected to delivery</text><circle cx="612" cy="37" r="13" fill="#E7F4EC"/><path d="m606 37 4 4 8-9" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g><g transform="translate(844 574)" filter="url(#shadow)"><rect width="242" height="106" rx="24" fill="#002B54"/><circle cx="48" cy="53" r="24" fill="#FAB72D"/><path d="m38 53 7 7 14-17" fill="none" stroke="#002B54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="47" font-family="Arial" font-weight="700" font-size="15" fill="#fff">Ready for evidence</text><text x="84" y="70" font-family="Arial" font-size="12" fill="#C8D4DF">Certificates &amp; reporting</text></g></svg>