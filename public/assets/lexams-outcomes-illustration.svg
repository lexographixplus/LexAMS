  <rect x="18" y="18" width="364" height="440" rx="20" fill="none" stroke="#FAB72D"/>
  <circle cx="200" cy="88" r="34" fill="#002B54"/><path d="m183 89 12 12 24-29" fill="none" stroke="#FAB72D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
